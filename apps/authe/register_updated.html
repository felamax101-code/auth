<script>

document.addEventListener("DOMContentLoaded", function(){
const emailStatus = document.getElementById("emailStatus");
const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("password_confirm");

const nameError = document.getElementById("nameError");
const emailError = document.getElementById("emailError");
const passwordError = document.getElementById("passwordError");
const confirmError = document.getElementById("confirmError");

const strengthBar = document.getElementById("strengthBar");
const registerBtn = document.getElementById("registerBtn");

registerBtn.disabled = true;

function checkForm(){
if(
nameError.innerText === "" &&
emailError.innerText === "" &&
passwordError.innerText === "" &&
confirmError.innerText === "" &&
nameInput.value !== "" &&
emailInput.value !== "" &&
passwordInput.value !== "" &&
confirmInput.value !== ""
){
registerBtn.disabled = false;
}else{
registerBtn.disabled = true;
}
}


// NAME VALIDATION
nameInput.addEventListener("input", function(){

if(nameInput.value.trim().length < 3){
nameError.innerText = "Name must be at least 3 characters";
}else{
nameError.innerText = "";
}

checkForm();

});


// EMAIL VALIDATION
emailInput.addEventListener("input", function(){

let pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

if(!pattern.test(emailInput.value)){
emailError.innerText = "Enter a valid email address";
emailStatus.innerText = "";
checkForm();
return;
}

emailError.innerText = "";

// AJAX REQUEST
fetch("http://127.0.0.1:8000/api/auth/check/email/",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body: JSON.stringify({email:emailInput.value})
})
.then(res=>res.json())
.then(data=>{

if(!data.available){
    emailStatus.style.color="#ff8080";
    emailStatus.innerText="Email already registered";

}else {
    emailStatus.style.color="#90ee90";
    emailStatus.innerText="✓ Email available"
}

checkForm();

});

});


// PASSWORD VALIDATION + STRENGTH
passwordInput.addEventListener("input", function(){

let password = passwordInput.value;

let strength = 0;
let message = "";

if(password.length >= 8) strength++;
if(/[A-Z]/.test(password)) strength++;
if(/[0-9]/.test(password)) strength++;
if(/[\W]/.test(password)) strength++;

if(password.length < 8){
message = "Password must be at least 8 characters";
}

passwordError.innerText = message;


// PASSWORD STRENGTH BAR
if(strength === 1){
strengthBar.style.width = "25%";
strengthBar.style.background = "red";
}
else if(strength === 2){
strengthBar.style.width = "50%";
strengthBar.style.background = "orange";
}
else if(strength === 3){
strengthBar.style.width = "75%";
strengthBar.style.background = "yellow";
}
else if(strength === 4){
strengthBar.style.width = "100%";
strengthBar.style.background = "lime";
}
else{
strengthBar.style.width = "0%";
}

// Re-check confirm if already typed
if(confirmInput.value){
validateConfirm();
}

checkForm();

});


// CONFIRM PASSWORD VALIDATION
confirmInput.addEventListener("input", function(){
validateConfirm();
checkForm();
});

function validateConfirm(){
if(confirmInput.value !== passwordInput.value){
confirmError.innerText = "Passwords do not match";
}else{
confirmError.innerText = "";
}
}

});


// SHOW / HIDE PASSWORD
function togglePassword(){

var field = document.getElementById("password");

if(field.type === "password"){
field.type = "text";
}else{
field.type = "password";
}

}

// SHOW / HIDE CONFIRM PASSWORD
function toggleConfirm(){

var field = document.getElementById("password_confirm");

if(field.type === "password"){
field.type = "text";
}else{
field.type = "password";
}

}


// SUBMIT TO DJANGO API
async function handleRegister(event){
event.preventDefault();

const payload = {
    username:         document.getElementById("name").value.trim(),
    email:            document.getElementById("email").value.trim(),
    password:         document.getElementById("password").value,
    password_confirm: document.getElementById("password_confirm").value,
}

try {
    const res = await fetch("http://127.0.0.1:8000/api/auth/register/", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify(payload)
    })

    const data = await res.json()

    if(res.ok){
        localStorage.setItem("pending_email", payload.email)
        window.location.href = "verify-email.php"
    } else {
        // Show Django errors on the right fields
        if(data.username)         document.getElementById("nameError").innerText    = data.username[0]
        if(data.email)            document.getElementById("emailError").innerText   = data.email[0]
        if(data.password)         document.getElementById("passwordError").innerText = data.password[0]
        if(data.password_confirm) document.getElementById("confirmError").innerText = data.password_confirm[0]
        if(data.non_field_errors) alert(data.non_field_errors[0])
    }

} catch(err) {
    alert("Network error. Please try again.")
}

}

</script>
