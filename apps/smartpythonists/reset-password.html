<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SmartPythonists — Reset Password</title>
<link rel="stylesheet" href="style.css"/>
<style>
.reset-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
.reset-card {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: var(--radius-xl); padding: 2.5rem;
  max-width: 440px; width: 100%;
}
.reset-logo { font-family: var(--font-mono); font-size: 1rem; font-weight: 700; color: var(--accent-py); margin-bottom: 2rem; display: flex; align-items: center; gap: 0.4rem; }
.reset-logo span { color: var(--accent-gold); }
</style>
</head>
<body>
<div class="reset-page">
  <div class="reset-card">
    <div class="reset-logo">🐍 Smart<span>Pythonists</span></div>
    <h2 style="font-family:var(--font-display);font-size:1.6rem;margin-bottom:0.4rem">Set new password 🔑</h2>
    <p style="color:var(--text-mute);font-size:0.88rem;margin-bottom:1.75rem">Create a strong password you haven't used before.</p>

    <div id="resetForm">
      <div class="auth-form__stack">
        <div class="form-group">
          <label class="form-label">New Password</label>
          <div class="input-wrap">
            <input type="password" id="newPw" placeholder="New password" oninput="checkStrength(this.value)"/>
            <span class="pw-eye" onclick="toggle('newPw',this)">👁</span>
          </div>
          <div class="pw-meter" id="pwMeter"><div class="pw-meter__bar"></div><div class="pw-meter__bar"></div><div class="pw-meter__bar"></div><div class="pw-meter__bar"></div></div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="input-wrap">
            <input type="password" id="confPw" placeholder="Confirm password"/>
            <span class="pw-eye" onclick="toggle('confPw',this)">👁</span>
          </div>
        </div>
        <button class="btn btn--primary btn--full btn--lg" onclick="doReset()">Reset Password →</button>
        <div style="text-align:center"><a href="auth.html" class="text-sec" style="font-size:0.82rem">← Back to Sign In</a></div>
      </div>
    </div>

    <div id="successMsg" class="hidden" style="text-align:center;padding:1.5rem 0">
      <div style="font-size:3rem;margin-bottom:1rem">✅</div>
      <h3 style="font-family:var(--font-display);margin-bottom:0.5rem">Password Reset!</h3>
      <p style="color:var(--text-sec);margin-bottom:1.5rem">You can now sign in with your new password.</p>
      <a href="auth.html" class="btn btn--primary">Go to Sign In →</a>
    </div>
  </div>
</div>

<script src="sp_core.js"></script>
<script>
const token = new URLSearchParams(location.search).get('token');
if (!token) { SP.toast('Invalid reset link','error'); setTimeout(()=>location.href='auth.html',2000); }

function toggle(id, el) {
  const i = document.getElementById(id);
  i.type = i.type==='password'?'text':'password';
  el.textContent = i.type==='password'?'👁':'🙈';
}
function checkStrength(pw) {
  let s = 0;
  if (pw.length>=8) s++; if (/[A-Z]/.test(pw)) s++; if (/[0-9]/.test(pw)) s++; if (/[^A-Za-z0-9]/.test(pw)) s++;
  document.getElementById('pwMeter').className = `pw-meter pw-meter--${s}`;
}
async function doReset() {
  const password = document.getElementById('newPw').value;
  const confirm  = document.getElementById('confPw').value;
  if (!password || !confirm) return SP.toast('Fill both fields','warning');
  if (password !== confirm) return SP.toast('Passwords do not match','error');
  const {ok,data} = await SP.UserAPI.resetConfirm({token, password, password_confirm: confirm});
  if (ok) { document.getElementById('resetForm').classList.add('hidden'); document.getElementById('successMsg').classList.remove('hidden'); }
  else SP.toast(SP.extractErrors(data),'error');
}
</script>
</body>
</html>
