<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SmartPythonists — Profile</title>
<link rel="stylesheet" href="style.css"/>
<style>
.profile-page { max-width: 640px; margin: 0 auto; padding: 2.5rem 0 4rem; }
.profile-hero {
  background: linear-gradient(135deg, rgba(59,159,88,0.06), rgba(0,212,255,0.03));
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 2.5rem;
  text-align: center;
  margin-bottom: 2rem;
  position: relative;
  overflow: hidden;
}
.profile-hero::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(59,159,88,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(59,159,88,0.04) 1px, transparent 1px);
  background-size: 24px 24px;
}
.profile-avatar {
  width: 90px; height: 90px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-py), var(--accent-cyan));
  display: flex; align-items: center; justify-content: center;
  font-size: 2.2rem; font-weight: 700; font-family: var(--font-display);
  margin: 0 auto 1rem; position: relative; z-index: 1;
  box-shadow: 0 0 40px rgba(59,159,88,0.3);
}
.profile-name { font-size: 1.6rem; font-family: var(--font-display); font-weight: 800; margin-bottom: 0.25rem; position: relative; z-index: 1; }
.profile-email { font-size: 0.85rem; color: var(--text-mute); font-family: var(--font-mono); position: relative; z-index: 1; }
.profile-badges { display: flex; gap: 0.5rem; justify-content: center; margin-top: 1rem; flex-wrap: wrap; position: relative; z-index: 1; }

.profile-form { display: flex; flex-direction: column; gap: 1.25rem; }
.section-title {
  font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700;
  letter-spacing: 0.12em; color: var(--text-mute); text-transform: uppercase;
  margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;
}
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
</style>
</head>
<body>
<nav class="navbar">
  <div class="container navbar__inner">
    <a href="index.html" class="navbar__logo">🐍 Smart<span>Pythonists</span></a>
    <div class="navbar__links">
      <a class="navbar__link" href="index.html">Feed</a>
      <a class="navbar__link" href="resources.html">Resources</a>
      <a class="navbar__link" href="dashboard.html">Dashboard</a>
    </div>
    <div class="navbar__actions">
      <div style="position:relative">
        <div class="navbar__avatar" id="avatarBtn" onclick="toggleDropdown()">?</div>
        <div class="dropdown" id="userDropdown">
          <div class="dropdown__item dropdown__item--danger" onclick="doLogout()">↩ Sign Out</div>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="container">
  <div class="profile-page">
    <!-- Back -->
    <div class="post-header__back" onclick="history.back()" style="margin-bottom:1.5rem;display:inline-flex;align-items:center;gap:0.4rem;font-size:0.82rem;color:var(--text-mute);cursor:pointer">← Back</div>

    <!-- Hero card -->
    <div class="profile-hero">
      <div class="profile-avatar" id="profileAvatar">?</div>
      <div class="profile-name" id="profileName">Loading...</div>
      <div class="profile-email" id="profileEmail"></div>
      <div class="profile-badges">
        <span class="badge badge--topic" id="profileRole"></span>
        <span class="badge badge--beginner" id="profileVerified" style="display:none">✓ Verified</span>
      </div>
    </div>

    <!-- Edit form -->
    <div class="card">
      <div class="section-title">⚙ Edit Profile</div>
      <div class="profile-form">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="prof-username" placeholder="Your username"/>
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="tel" id="prof-phone" placeholder="+1234567890"/>
        </div>
        <div class="form-group">
          <label class="form-label">Email <span style="color:var(--text-mute)">(read-only)</span></label>
          <input type="email" id="prof-email" disabled style="opacity:0.5"/>
        </div>
        <div style="display:flex;gap:0.75rem">
          <button class="btn btn--primary" onclick="doSaveProfile()">Save Changes ✓</button>
          <button class="btn btn--secondary" onclick="loadProfileData()">Reset</button>
        </div>
      </div>
    </div>

    <!-- Reactivate section (if deactivated) -->
    <div class="card hidden" id="reactivateCard" style="border-color:rgba(240,180,41,0.3)">
      <div class="section-title">♻ Reactivate Account</div>
      <p style="font-size:0.88rem;color:var(--text-sec);margin-bottom:1rem">Your account is deactivated. Enter your credentials to reactivate.</p>
      <div class="auth-form__stack" style="max-width:400px">
        <div class="form-group"><label class="form-label">Email</label><input type="email" id="react-email"/></div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" id="react-pw"/></div>
        <button class="btn btn--gold" onclick="doReactivate()">Reactivate Account ♻</button>
      </div>
    </div>

  </div>
</div>

<script src="sp_core.js"></script>
<script>
SP.requireAuth();

(function() {
  const u = SP.Auth.getUser();
  if (u) { document.getElementById('avatarBtn').textContent = (u.username||'U')[0].toUpperCase(); }
})();

async function loadProfileData() {
  const {ok,data} = await SP.UserAPI.profile();
  if (!ok) return;
  document.getElementById('profileAvatar').textContent = (data.username||'?')[0].toUpperCase();
  document.getElementById('profileName').textContent = data.username;
  document.getElementById('profileEmail').textContent = data.email;
  document.getElementById('profileRole').textContent = `🐍 ${data.role}`;
  if (data.is_email_verified) { document.getElementById('profileVerified').style.display = 'inline-flex'; }
  document.getElementById('prof-username').value = data.username;
  document.getElementById('prof-phone').value = data.phone || '';
  document.getElementById('prof-email').value = data.email;
}
loadProfileData();

async function doSaveProfile() {
  const username = document.getElementById('prof-username').value.trim();
  const phone = document.getElementById('prof-phone').value.trim();
  if (!username) return SP.toast('Username is required','warning');
  const {ok,data} = await SP.UserAPI.updateProfile({username,phone});
  if (ok) { SP.toast('Profile updated! ✓','success'); loadProfileData(); }
  else SP.toast(SP.extractErrors(data),'error');
}

async function doReactivate() {
  const email = document.getElementById('react-email').value.trim();
  const password = document.getElementById('react-pw').value;
  const {ok,data} = await SP.UserAPI.reactivate({email,password});
  if (ok) { SP.toast('Account reactivated! 🎉','success'); setTimeout(()=>location.href='auth.html',1500); }
  else SP.toast(SP.extractErrors(data),'error');
}

function toggleDropdown() { document.getElementById('userDropdown').classList.toggle('open'); }
document.addEventListener('click', e => { if (!e.target.closest('#avatarBtn') && !e.target.closest('#userDropdown')) document.getElementById('userDropdown')?.classList.remove('open'); });
async function doLogout() { await SP.UserAPI.logout({refresh:SP.Auth.getRefresh()}); SP.Auth.clear(); window.location.href='auth.html'; }
</script>
</body>
</html>
