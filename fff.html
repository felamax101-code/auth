<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartShop</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #c9a96e;
    --accent2: #e8c898;
    --text: #f0ece4;
    --muted: #888;
    --error: #e05555;v 
    --success: #55a87a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem 2.5rem; background: var(--surface);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
  }
  .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--accent); letter-spacing: 1px; }
  .nav-links { display: flex; gap: 0.5rem; align-items: center; }
  .nav-btn {
    background: none; border: 1px solid var(--border); color: var(--text);
    padding: 0.5rem 1.2rem; border-radius: 6px; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 0.85rem; transition: all 0.2s;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 500; }
  .cart-btn {
    background: var(--accent); color: #000; border: none; padding: 0.5rem 1.2rem;
    border-radius: 6px; cursor: pointer; font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 0.4rem; transition: background 0.2s;
  }
  .cart-btn:hover { background: var(--accent2); }
  .badge {
    background: #000; color: var(--accent); border-radius: 50%;
    width: 18px; height: 18px; font-size: 0.7rem;
    display: flex; align-items: center; justify-content: center; font-weight: 700;
  }
  .page { display: none; padding: 2.5rem; max-width: 1200px; margin: 0 auto; }
  .page.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .auth-container {
    max-width: 420px; margin: 3rem auto; background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem;
  }
  .auth-container h2 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--accent); margin-bottom: 0.4rem; }
  .auth-container p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.8rem; }
  .form-group { margin-bottom: 1.2rem; }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.5px; }
  input, select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 0.75rem 1rem; border-radius: 8px;
    font-family: 'DM Sans', sans-serif; font-size: 0.9rem; transition: border-color 0.2s;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .btn-primary {
    width: 100%; background: var(--accent); color: #000; border: none;
    padding: 0.85rem; border-radius: 8px; font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem; font-weight: 500; cursor: pointer; margin-top: 0.5rem; transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--accent2); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .switch-link { text-align: center; margin-top: 1.2rem; font-size: 0.85rem; color: var(--muted); }
  .switch-link span { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .alert { padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
  .alert.error { background: rgba(224,85,85,0.15); border: 1px solid var(--error); color: var(--error); display: block; }
  .alert.success { background: rgba(85,168,122,0.15); border: 1px solid var(--success); color: var(--success); display: block; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
  .page-header h1 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--accent); }
  .search-bar { display: flex; gap: 0.8rem; margin-bottom: 2rem; }
  .search-bar input { flex: 1; max-width: 350px; }
  .search-bar button {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    padding: 0.75rem 1.2rem; border-radius: 8px; cursor: pointer; transition: border-color 0.2s;
  }
  .search-bar button:hover { border-color: var(--accent); }
  .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
  .product-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; transition: transform 0.2s, border-color 0.2s;
  }
  .product-card:hover { transform: translateY(-4px); border-color: var(--accent); }
  .product-img {
    width: 100%; height: 180px; background: var(--surface2);
    display: flex; align-items: center; justify-content: center; font-size: 3rem;
  }
  .product-info { padding: 1.2rem; }
  .product-category { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 0.4rem; }
  .product-name { font-family: 'Playfair Display', serif; font-size: 1.1rem; margin-bottom: 0.5rem; }
  .product-price { font-size: 1.2rem; font-weight: 500; color: var(--accent); margin-bottom: 0.8rem; }
  .product-stock { font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem; }
  .product-stock.low { color: var(--error); }
  .add-row { display: flex; gap: 0.5rem; align-items: center; }
  .qty-input { width: 60px !important; text-align: center; padding: 0.5rem !important; }
  .btn-add {
    flex: 1; background: none; border: 1px solid var(--accent); color: var(--accent);
    padding: 0.6rem; border-radius: 6px; cursor: pointer; font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem; transition: all 0.2s;
  }
  .btn-add:hover { background: var(--accent); color: #000; }
  .cart-empty { text-align: center; padding: 4rem; color: var(--muted); }
  .cart-empty .icon { font-size: 4rem; margin-bottom: 1rem; }
  .cart-item {
    display: flex; align-items: center; gap: 1.2rem; padding: 1.2rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 1rem;
  }
  .cart-item-icon {
    font-size: 2rem; width: 60px; height: 60px; background: var(--surface2);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
  }
  .cart-item-info { flex: 1; }
  .cart-item-name { font-weight: 500; margin-bottom: 0.2rem; }
  .cart-item-price { color: var(--accent); font-size: 0.9rem; }
  .cart-summary {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 1.5rem; margin-top: 1.5rem;
  }
  .cart-summary-row { display: flex; justify-content: space-between; margin-bottom: 0.8rem; font-size: 0.9rem; color: var(--muted); }
  .cart-summary-total {
    display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 500;
    color: var(--accent); border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 0.5rem;
  }
  .btn-checkout {
    width: 100%; background: var(--accent); color: #000; border: none; padding: 1rem;
    border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 1rem;
    font-weight: 500; cursor: pointer; margin-top: 1rem; transition: background 0.2s;
  }
  .btn-checkout:hover { background: var(--accent2); }
  .btn-checkout:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-remove {
    background: none; border: 1px solid var(--border); color: var(--error);
    padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s;
  }
  .btn-remove:hover { background: rgba(224,85,85,0.1); border-color: var(--error); }
  .order-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; margin-bottom: 1rem; }
  .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .order-id { font-family: 'Playfair Display', serif; font-size: 1.1rem; }
  .status-badge { padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
  .status-pending { background: rgba(201,169,110,0.15); color: var(--accent); border: 1px solid var(--accent); }
  .status-processing { background: rgba(85,122,224,0.15); color: #6b9fe0; border: 1px solid #6b9fe0; }
  .status-delivered { background: rgba(85,168,122,0.15); color: var(--success); border: 1px solid var(--success); }
  .order-items { color: var(--muted); font-size: 0.85rem; line-height: 2; }
  .loader { text-align: center; padding: 3rem; color: var(--muted); }
  .spinner {
    width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .user-info { display: flex; align-items: center; gap: 0.6rem; font-size: 0.85rem; color: var(--muted); }
  .user-avatar {
    width: 32px; height: 32px; background: var(--accent); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; color: #000; font-weight: 700; font-size: 0.8rem;
  }
  .toast {
    position: fixed; bottom: 2rem; right: 2rem; background: var(--surface);
    border: 1px solid var(--accent); color: var(--text); padding: 0.9rem 1.4rem;
    border-radius: 10px; font-size: 0.9rem; transform: translateY(100px); opacity: 0;
    transition: all 0.3s; z-index: 1000; max-width: 300px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .divider { height: 1px; background: var(--border); margin: 1rem 0; }
</style>
</head>
<body>

<nav>
  <div class="logo">SmartShop</div>
  <div class="nav-links" id="navLinks">
    <button class="nav-btn" onclick="showPage('login')">Login</button>
    <button class="nav-btn" onclick="showPage('register')">Register</button>
  </div>
</nav>

<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div class="page active" id="loginPage">
  <div class="auth-container">
    <h2>Welcome back</h2>
    <p>Sign in to continue shopping</p>
    <div class="alert" id="loginAlert"></div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" onkeyup="if(event.key==='Enter')login()">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" onkeyup="if(event.key==='Enter')login()">
    </div>
    <button class="btn-primary" id="loginBtn" onclick="login()">Sign In</button>
    <div class="switch-link">Don't have an account? <span onclick="showPage('register')">Register here</span></div>
  </div>
</div>

<!-- REGISTER -->
<div class="page" id="registerPage">
  <div class="auth-container">
    <h2>Create account</h2>
    <p>Join SmartShop today</p>
    <div class="alert" id="registerAlert"></div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="regUsername" placeholder="yourname">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="regEmail" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="regPassword" placeholder="••••••••">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="regConfirm" placeholder="••••••••" onkeyup="if(event.key==='Enter')register()">
    </div>
    <button class="btn-primary" id="registerBtn" onclick="register()">Create Account</button>
    <div class="switch-link">Already have an account? <span onclick="showPage('login')">Sign in</span></div>
  </div>
</div>

<!-- PRODUCTS -->
<div class="page" id="productsPage">
  <div class="page-header"><h1>Products</h1></div>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search products..." onkeyup="if(event.key==='Enter')loadProducts()">
    <button onclick="loadProducts()">Search</button>
  </div>
  <div id="productsContainer"><div class="loader"><div class="spinner"></div>Loading...</div></div>
</div>

<!-- CART -->
<div class="page" id="cartPage">
  <div class="page-header"><h1>My Cart</h1></div>
  <div id="cartContainer"><div class="loader"><div class="spinner"></div>Loading...</div></div>
</div>

<!-- ORDERS -->
<div class="page" id="ordersPage">
  <div class="page-header"><h1>My Orders</h1></div>
  <div id="ordersContainer"><div class="loader"><div class="spinner"></div>Loading...</div></div>
</div>

<script>
const API = 'http://127.0.0.1:8000/api';
const SHOP = `${API}/ec`;
let accessToken = localStorage.getItem('access');
let refreshToken = localStorage.getItem('refresh');
let currentUser = JSON.parse(localStorage.getItem('user') || 'null');

function headers() {
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken}` };
}

async function api(url, opts = {}) {
  const res = await fetch(url, opts);
  if (res.status === 401) { logout(); return null; }
  return res;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function alert_(id, msg, type = 'error') {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = `alert ${type}`;
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(name + 'Page').classList.add('active');
  document.querySelectorAll('[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === name));
  if (name === 'products') loadProducts();
  if (name === 'cart') loadCart();
  if (name === 'orders') loadOrders();
}

function updateNav() {
  const nav = document.getElementById('navLinks');
  if (currentUser) {
    nav.innerHTML = `
      <div class="user-info">
        <div class="user-avatar">${currentUser.username[0].toUpperCase()}</div>
        <span>${currentUser.username}</span>
      </div>
      <button class="nav-btn" data-page="products" onclick="showPage('products')">Products</button>
      <button class="nav-btn" data-page="orders" onclick="showPage('orders')">Orders</button>
      <button class="cart-btn" data-page="cart" onclick="showPage('cart')">
        🛒 Cart <span class="badge" id="cartBadge">0</span>
      </button>
      <button class="nav-btn" onclick="logout()">Logout</button>
    `;
  } else {
    nav.innerHTML = `
      <button class="nav-btn" onclick="showPage('login')">Login</button>
      <button class="nav-btn" onclick="showPage('register')">Register</button>
    `;
  }
}

async function register() {
  const username = document.getElementById('regUsername').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const confirm = document.getElementById('regConfirm').value;

  if (!username || !email || !password || !confirm)
    return alert_('registerAlert', 'Please fill in all fields');

  const btn = document.getElementById('registerBtn');
  btn.disabled = true; btn.textContent = 'Creating account...';

  try {
    const res = await fetch(`${API}/auth/register/`, {  
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password, confirm_password: confirm })
    });
    const data = await res.json();
    if (res.ok) {
      alert_('registerAlert', '✓ Account created! Please login.', 'success');
      setTimeout(() => showPage('login'), 1500);
    } else {
      alert_('registerAlert', Object.values(data).flat().join(' '));
    }
  } catch (e) {
    alert_('registerAlert', 'Cannot connect to server. Is Django running?');
  }
  btn.disabled = false; btn.textContent = 'Create Account';
}

async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  if (!email || !password) return alert_('loginAlert', 'Please fill in all fields');

  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in...';

  try {
    const res = await fetch(`${API}/auth/login/`, {  
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (res.ok) {
      accessToken = data.access;
      refreshToken = data.refresh;
      localStorage.setItem('access', accessToken);
      localStorage.setItem('refresh', refreshToken);
      currentUser = { username: email.split('@')[0], email, role: data.role || 'customer' };
      localStorage.setItem('user', JSON.stringify(currentUser));
      updateNav();
      showPage('products');
      toast(`Welcome back, ${currentUser.username}! 👋`);
    } else {
      alert_('loginAlert', Object.values(data).flat().join(' '));
    }
  } catch (e) {
    alert_('loginAlert', 'Cannot connect to server. Is Django running on port 8000?');
  }
  btn.disabled = false; btn.textContent = 'Sign In';
}

function logout() {
  if (refreshToken) {
    fetch(`${API}/auth/logout/`, {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ refresh: refreshToken })
    }).catch(() => {});
  }
  accessToken = refreshToken = currentUser = null;
  localStorage.removeItem('access');
  localStorage.removeItem('refresh');
  localStorage.removeItem('user');
  updateNav();
  showPage('login');
  toast('Logged out successfully');
}

const EMOJIS = ['📦','👟','📱','💻','🎒','⌚','🎧','📷','🖥️','🎮','👜','🕶️'];

async function loadProducts() {
  const search = document.getElementById('searchInput')?.value.trim() || '';
  const url = search ? `${SHOP}/products/?search=${encodeURIComponent(search)}` : `${SHOP}/products/`;
  document.getElementById('productsContainer').innerHTML = '<div class="loader"><div class="spinner"></div>Loading products...</div>';
  try {
    const res = await api(url, { headers: headers() });
    if (!res) return;
    const data = await res.json();
    const products = data.results || data;
    if (!products.length) {
      document.getElementById('productsContainer').innerHTML = '<div class="loader">No products found 😔</div>';
      return;
    }
    document.getElementById('productsContainer').innerHTML = `
      <div class="products-grid">
        ${products.map((p, i) => `
          <div class="product-card">
            <div class="product-img">${EMOJIS[i % EMOJIS.length]}</div>
            <div class="product-info">
              <div class="product-category">${p.category_name || 'General'}</div>
              <div class="product-name">${p.name}</div>
              <div class="product-price">$${parseFloat(p.price).toFixed(2)}</div>
              <div class="product-stock ${p.stock < 5 ? 'low' : ''}">
                ${p.stock === 0 ? '❌ Out of stock' : p.stock < 5 ? `⚠️ Only ${p.stock} left` : `✓ ${p.stock} in stock`}
              </div>
              ${p.stock > 0 && p.is_available ? `
                <div class="add-row">
                  <input type="number" class="qty-input" id="qty_${p.id}" value="1" min="1" max="${p.stock}">
                  <button class="btn-add" onclick="addToCart(${p.id}, '${p.name.replace(/'/g,"\\'")}')">+ Add to Cart</button>
                </div>
              ` : '<button class="btn-add" disabled style="opacity:0.4;cursor:not-allowed">Unavailable</button>'}
            </div>
          </div>
        `).join('')}
      </div>`;
  } catch (e) {
    document.getElementById('productsContainer').innerHTML = '<div class="loader">Failed to load products.</div>';
  }
}

async function addToCart(productId, name) {
  const qty = parseInt(document.getElementById(`qty_${productId}`)?.value || 1);
  try {
    const res = await api(`${SHOP}/cart/add/`, {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ product: productId, quantity: qty })
    });
    if (!res) return;
    if (res.ok) {
      const data = await res.json();
      const badge = document.getElementById('cartBadge');
      if (badge) badge.textContent = data.items?.length || 0;
      toast(`✓ ${name} added to cart!`);
    } else {
      const data = await res.json();
      toast(`❌ ${Object.values(data).flat().join(' ')}`);
    }
  } catch (e) { toast('Failed to add to cart'); }
}

async function loadCart() {
  document.getElementById('cartContainer').innerHTML = '<div class="loader"><div class="spinner"></div>Loading cart...</div>';
  try {
    const res = await api(`${SHOP}/cart/`, { headers: headers() });
    if (!res) return;
    const cart = await res.json();
    const badge = document.getElementById('cartBadge');
    if (badge) badge.textContent = cart.items?.length || 0;
    if (!cart.items || !cart.items.length) {
      document.getElementById('cartContainer').innerHTML = `
        <div class="cart-empty">
          <div class="icon">🛒</div>
          <p>Your cart is empty</p>
          <button class="btn-primary" style="width:auto;padding:0.7rem 2rem;margin-top:1rem" onclick="showPage('products')">Browse Products</button>
        </div>`;
      return;
    }
    document.getElementById('cartContainer').innerHTML = `
      <div style="max-width:700px">
        ${cart.items.map((item, i) => `
          <div class="cart-item">
            <div class="cart-item-icon">${EMOJIS[i % EMOJIS.length]}</div>
            <div class="cart-item-info">
              <div class="cart-item-name">${item.product_name}</div>
              <div class="cart-item-price">$${parseFloat(item.product_price).toFixed(2)} each</div>
            </div>
            <div style="display:flex;align-items:center;gap:1rem">
              <span style="color:var(--accent);font-weight:500">${item.quantity} × $${parseFloat(item.subtotal).toFixed(2)}</span>
              <button class="btn-remove" onclick="removeFromCart(${item.id})">Remove</button>
            </div>
          </div>`).join('')}
        <div class="cart-summary">
          <div class="cart-summary-row"><span>Items (${cart.items.length})</span><span>$${parseFloat(cart.total).toFixed(2)}</span></div>
          <div class="cart-summary-row"><span>Shipping</span><span style="color:var(--success)">Free</span></div>
          <div class="cart-summary-total"><span>Total</span><span>$${parseFloat(cart.total).toFixed(2)}</span></div>
          <button class="btn-checkout" id="checkoutBtn" onclick="checkout()">Proceed to Checkout →</button>
        </div>
      </div>`;
  } catch (e) {
    document.getElementById('cartContainer').innerHTML = '<div class="loader">Failed to load cart.</div>';
  }
}

async function removeFromCart(itemId) {
  try {
    const res = await api(`${SHOP}/cart/remove/${itemId}/`, { method: 'DELETE', headers: headers() });
    if (res && res.ok) { toast('Item removed'); loadCart(); }
  } catch (e) { toast('Failed to remove item'); }
}

async function checkout() {
  const btn = document.getElementById('checkoutBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Processing...'; }
  try {
    const res = await api(`${SHOP}/orders/checkout/`, { method: 'POST', headers: headers() });
    if (!res) return;
    if (res.ok) {
      toast('🎉 Order placed successfully!');
      showPage('orders');
    } else {
      const data = await res.json();
      toast(`❌ ${data.detail || 'Checkout failed'}`);
      if (btn) { btn.disabled = false; btn.textContent = 'Proceed to Checkout →'; }
    }
  } catch (e) {
    toast('Checkout failed');
    if (btn) { btn.disabled = false; btn.textContent = 'Proceed to Checkout →'; }
  }
}

async function loadOrders() {
  document.getElementById('ordersContainer').innerHTML = '<div class="loader"><div class="spinner"></div>Loading orders...</div>';
  try {
    const res = await api(`${SHOP}/orders/`, { headers: headers() });
    if (!res) return;
    const data = await res.json();
    const orders = data.results || data;
    if (!orders.length) {
      document.getElementById('ordersContainer').innerHTML = `
        <div class="cart-empty">
          <div class="icon">📋</div>
          <p>No orders yet</p>
          <button class="btn-primary" style="width:auto;padding:0.7rem 2rem;margin-top:1rem" onclick="showPage('products')">Start Shopping</button>
        </div>`;
      return;
    }
    document.getElementById('ordersContainer').innerHTML = `
      <div style="max-width:700px">
        ${orders.map(order => `
          <div class="order-card">
            <div class="order-header">
              <div class="order-id">Order #${order.id}</div>
              <span class="status-badge status-${order.status}">${order.status}</span>
            </div>
            <div class="order-items">
              ${order.items.map(item => `<div>• ${item.quantity} × ${item.product_name} — $${parseFloat(item.subtotal).toFixed(2)}</div>`).join('')}
            </div>
            <div class="divider"></div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="color:var(--muted);font-size:0.8rem">${new Date(order.created_at).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})}</span>
              <span style="color:var(--accent);font-weight:500">Total: $${parseFloat(order.total).toFixed(2)}</span>
            </div>
          </div>`).join('')}
      </div>`;
  } catch (e) {
    document.getElementById('ordersContainer').innerHTML = '<div class="loader">Failed to load orders.</div>';
  }
}

// INIT
updateNav();
if (currentUser && accessToken) showPage('products');
</script>
</body>
</html>
