<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Auth Tester</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
    .profile-grid .field:last-child { grid-column: 1 / -1; }
    .section-title {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin: 1.5rem 0 0.75rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }
    .token-input {
      font-size: 0.65rem;
      color: var(--accent);
      background: var(--bg);
    }
  </style>
</head>
<body>

<nav>
  <a href="register.html" class="brand">// AUTH_TESTER</a>
  <a href="register.html">Register</a>
  <a href="login.html">Login</a>
  <a href="verify-email.html">Verify Email</a>
  <a href="reset-request.html">Reset PW</a>
  <a href="profile.html">Profile</a>
</nav>

<div class="card" style="max-width:560px;">
  <div class="card-title">Profile</div>
  <div class="card-sub">GET & PUT /profile/</div>

  <div class="alert" id="alert"></div>

  <!-- Token -->
  <div class="section-title">Auth Token</div>
  <div class="field">
    <label>Access Token (from localStorage or paste)</label>
    <input type="text" id="token" class="token-input" placeholder="Bearer token auto-loaded from login" />
  </div>

  <!-- GET -->
  <div class="section-title">View Profile</div>
  <button class="btn btn-ghost" id="get-btn">GET Profile</button>
  <div class="response-box" id="get-response"></div>

  <!-- PUT -->
  <div class="section-title">Update Profile</div>
  <div class="profile-grid">
    <div class="field">
      <label>Username</label>
      <input type="text" id="username" placeholder="new_username" />
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="new@example.com" />
    </div>
  </div>

  <button class="btn btn-primary" id="put-btn">Update Profile</button>
  <div class="response-box" id="put-response"></div>

  <!-- Logout -->
  <div class="section-title">Session</div>
  <button class="btn btn-danger" id="logout-btn">Logout All Devices</button>
  <div class="response-box" id="logout-response"></div>
</div>

<script src="../js/utils.js"></script>
<script>
  // Auto-load token
  const saved = Auth.getAccess();
  if (saved) document.getElementById('token').value = saved;

  function getToken() {
    const val = document.getElementById('token').value.trim();
    // Accept with or without "Bearer " prefix
    return val.replace(/^Bearer\s+/i, '');
  }

  // GET
  document.getElementById('get-btn').addEventListener('click', async () => {
    const btn   = document.getElementById('get-btn');
    const alert = document.getElementById('alert');
    const res   = document.getElementById('get-response');

    hideAlert(alert);
    setLoading(btn, true);

    const token = getToken();
    const { ok, data } = await apiFetch('/profile/', {
      method: 'GET',
      headers: { 'Authorization': `Bearer ${token}` },
    });

    setLoading(btn, false);
    showResponse(res, data);

    if (ok) {
      // Auto-fill update form
      document.getElementById('username').value = data.username || '';
      document.getElementById('email').value    = data.email    || '';
      showAlert(alert, 'Profile loaded.', 'success');
    } else {
      showAlert(alert, flattenErrors(data), 'error');
    }
  });

  // PUT
  document.getElementById('put-btn').addEventListener('click', async () => {
    const btn   = document.getElementById('put-btn');
    const alert = document.getElementById('alert');
    const res   = document.getElementById('put-response');

    hideAlert(alert);
    setLoading(btn, true);

    const token = getToken();
    const body  = {
      username: document.getElementById('username').value.trim(),
      email:    document.getElementById('email').value.trim(),
    };

    const { ok, data } = await apiFetch('/profile/', {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}` },
      body,
    });

    setLoading(btn, false);
    showResponse(res, data);

    if (ok) {
      showAlert(alert, 'Profile updated.', 'success');
    } else {
      showAlert(alert, flattenErrors(data), 'error');
    }
  });

  // Logout all
  document.getElementById('logout-btn').addEventListener('click', async () => {
    const btn   = document.getElementById('logout-btn');
    const alert = document.getElementById('alert');
    const res   = document.getElementById('logout-response');

    hideAlert(alert);
    setLoading(btn, true);

    const token = getToken();
    const { ok, data } = await apiFetch('/logout-all/', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` },
    });

    setLoading(btn, false);
    showResponse(res, data);

    if (ok) {
      Auth.clear();
      document.getElementById('token').value = '';
      showAlert(alert, 'Logged out from all devices. Tokens cleared.', 'success');
    } else {
      showAlert(alert, flattenErrors(data), 'error');
    }
  });
</script>
</body>
</html>
