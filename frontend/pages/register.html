<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Auth Tester</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<nav>
  <a href="register.html" class="brand">// AUTH_TESTER</a>
  <a href="register.html">Register</a>
  <a href="login.html">Login</a>
  <a href="verify-email.html">Verify Email</a>
  <a href="reset-request.html">Reset PW</a>
  <a href="profile.html">Profile</a>
</nav>

<div class="card">
  <div class="card-title">Register</div>
  <div class="card-sub">POST /register/</div>

  <div class="alert" id="alert"></div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="user@example.com" />
  </div>
  <div class="field">
    <label>Username</label>
    <input type="text" id="username" placeholder="john_doe" />
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" />
  </div>
  <div class="field">
    <label>Confirm Password</label>
    <input type="password" id="password_confirm" placeholder="••••••••" />
  </div>

  <button class="btn btn-primary" id="btn">Register</button>

  <div class="response-box" id="response"></div>

  <span class="link">Already have an account? <a href="login.html">Login</a></span>
</div>

<script src="../js/utils.js"></script>
<script>
  document.getElementById('btn').addEventListener('click', async () => {
    const btn   = document.getElementById('btn');
    const alert = document.getElementById('alert');
    const res   = document.getElementById('response');

    hideAlert(alert);
    setLoading(btn, true);

    const body = {
      email:            document.getElementById('email').value.trim(),
      username:         document.getElementById('username').value.trim(),
      password:         document.getElementById('password').value,
      password_confirm: document.getElementById('password_confirm').value,
    };

    const { ok, data } = await apiFetch('/register/', { method: 'POST', body });

    setLoading(btn, false);
    showResponse(res, data);

    if (ok) {
      showAlert(alert, data.message || 'Registration successful! Check your email.', 'success');
      // Pre-fill email on verify page
      sessionStorage.setItem('verify_email', body.email);
    } else {
      showAlert(alert, flattenErrors(data), 'error');
    }
  });
</script>
</body>
</html>
